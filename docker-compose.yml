services:
  scansnap:
    build: .
    container_name: scansnap
    restart: unless-stopped
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ${CONSUME_PATH:-./consume}:/output
    device_cgroup_rules:
      - 'c 189:* rmw'
    environment:
      - RESOLUTION=${RESOLUTION:-300}
      - MODE=${MODE:-Color}
      - SOURCE=${SOURCE:-ADF Duplex}
      - POLL_INTERVAL=${POLL_INTERVAL:-0.5}
      - DEBOUNCE=${DEBOUNCE:-3}
      # Heartbeat URL, set outside the repo (it's public): empty means no pings.
      - HC_URL=${HC_URL:-}
    # The scan loop touches /tmp/scanner-ok on every pass, scanner on or in standby.
    healthcheck:
      test: ["CMD", "bash", "-c", "f=/tmp/scanner-ok; [ -f $$f ] && [ $$(( $$(date +%s) - $$(stat -c %Y $$f) )) -lt 60 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
